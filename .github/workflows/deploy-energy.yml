name: Build and deploy energy site

on:
  push:
    branches:
      - main
    paths:
      - "energy-react/**"
      - ".github/workflows/deploy-energy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: energy-react/package-lock.json

      - name: Install dependencies
        working-directory: energy-react
        run: npm ci

      - name: Build static export
        working-directory: energy-react
        run: npm run build

      - name: Refresh GitHub Pages files
        run: |
          rm -rf docs
          mkdir -p docs
          cp -R energy-react/out/. docs/

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Deploy upgraded energy site"
          git push
